import javax.inject.Inject
import java.nio.file.Files
import java.nio.file.Paths
import java.util.stream.Collectors

plugins {
    id('com.android.library')
}

android {
    namespace 'io.github.muntashirakon.AppManager.server'
    compileSdk compile_sdk
    buildToolsVersion = build_tools

    defaultConfig {
        minSdk min_sdk
        targetSdk target_sdk
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly project(path: ':hiddenapi')

    api project(path: ':libserver')

    implementation "androidx.annotation:annotation:${annotation_version}"
}

// https://docs.gradle.org/current/userguide/service_injection.html#execoperations
interface InjectedExecOps {
    @Inject
    ExecOperations getExecOps()
}

android.libraryVariants.configureEach { variant ->
    String buildType = variant.buildType.name
    String buildTypeCap = buildType.capitalize()
    def compileTask = variant.javaCompileProvider
    def libServerCompileTask = project(':libserver').tasks.named("compile${buildTypeCap}JavaWithJavac")
    def injected = project.objects.newInstance(InjectedExecOps)
    // Fork: capture project/android references at configuration time (configuration-cache
    // requirement — Task.project / android.* / project-property access at execution time is
    // forbidden). Upstream's rewrite reads android.sdkDirectory / target_sdk / min_sdk and the
    // compile-task output dirs inside doLast; we resolve them here into plain values / providers
    // so the doLast closure holds only serializable state.
    String serverPkg = "io/github/muntashirakon/AppManager/server"
    def capturedMinSdk = min_sdk
    int capturedTargetSdk = target_sdk
    String capturedSdkDirPath = android.sdkDirectory.path
    String capturedBuildToolsVersion = android.buildToolsVersion
    String androidJar = "${capturedSdkDirPath}/platforms/android-${capturedTargetSdk}/android.jar"
    String d8Path = "${capturedSdkDirPath}/build-tools/${capturedBuildToolsVersion}/d8"
    def serverClassesDirProvider = compileTask.map { it.destinationDirectory.get().asFile.absolutePath }
    def libserverClassesDirProvider = libServerCompileTask.map { it.destinationDirectory.get().asFile.absolutePath }
    tasks.register("create${buildTypeCap}ServerJars") {
        inputs.dir(compileTask.map { it.destinationDirectory.get() })
        inputs.dir(libServerCompileTask.map { it.destinationDirectory.get() })

        String srcDir = buildType == "release" ? "main" : buildType
        File assetsDir = file("${project.rootDir}/app/src/${srcDir}/assets")
        File amJar = new File(assetsDir, "am.jar")
        File mainJar = new File(assetsDir, "main.jar")

        outputs.file(amJar)
        outputs.file(mainJar)

        doLast {
            println("Building Server JARs for type: ${buildType}")
            assetsDir.mkdirs()

            // Fork: config-cache safe — the class dirs come from providers captured at
            // configuration time, never from compileTask.get() inside doLast.
            String serverClassDir = serverClassesDirProvider.get()
            String libserverClassDir = libserverClassesDirProvider.get() + "/${serverPkg}/common"

            // Upstream: make sure the build script and d8 use the same version of java.
            // NOTE: androidJar/d8Path are already hoisted to configuration time above —
            // re-declaring them here (as upstream does) would shadow them and fail to compile.
            String gradleJavaHome = System.getProperty("java.home")
            File gradleJava = new File(gradleJavaHome, "bin/java")
            if (!gradleJava.isFile()) {
                gradleJavaHome = new File(gradleJavaHome).parent
            }
            String gradlePath = "${gradleJavaHome}/bin:${System.getenv('PATH')}"

            def runD8 = { List<String> args ->
                injected.execOps.exec {
                    environment "JAVA_HOME", gradleJavaHome
                    environment "PATH", gradlePath
                    executable = d8Path
                    it.args(args)
                }
            }

            println("Creating am.jar...")
            def amArgs = ['--release', '--min-api', capturedMinSdk, '--output', amJar.absolutePath, '--lib', androidJar]
            amArgs.addAll(Files.list(Paths.get(libserverClassDir)).filter {
                !it.fileName.toString().startsWith("IRootServiceManager")
            }.map { it.toString() }.sorted().collect(Collectors.toList()))
            amArgs.addAll(Files.list(Paths.get("${serverClassDir}/${serverPkg}")).filter {
                !it.fileName.toString().startsWith("RootServiceMain") && Files.isRegularFile(it)
            }.map { it.toString() }.sorted().collect(Collectors.toList()))
            runD8(amArgs)
            println("Created ${amJar}")

            println("Creating main.jar...")
            def mainArgs = ['--release', '--min-api', capturedMinSdk, '--output', mainJar.absolutePath, '--lib', androidJar]
            mainArgs.addAll(Files.list(Paths.get(libserverClassDir)).filter {
                it.fileName.toString().startsWith("IRootServiceManager") || it.fileName.toString().startsWith("ServerUtils")
            }.map { it.toString() }.sorted().collect(Collectors.toList()))
            mainArgs.addAll(Files.list(Paths.get("${serverClassDir}/${serverPkg}")).filter {
                it.fileName.toString().startsWith("RootServiceMain") && Files.isRegularFile(it)
            }.map { it.toString() }.sorted().collect(Collectors.toList()))
            runD8(mainArgs)
            println("Created ${mainJar}")
        }
    }

    compileTask.configure { finalizedBy("create${buildTypeCap}ServerJars") }
}

// Fork: capture rootProject.projectDir at config time for the cleanup task (configuration-cache).
String capturedRootProjectDir = rootProject.projectDir.absolutePath
tasks.register('cleanupServerJars') {
    doLast {
        new File("${capturedRootProjectDir}/app/src/main/assets/am.jar").delete()
        new File("${capturedRootProjectDir}/app/src/main/assets/main.jar").delete()
        new File("${capturedRootProjectDir}/app/src/debug/assets/am.jar").delete()
        new File("${capturedRootProjectDir}/app/src/debug/assets/main.jar").delete()
    }
}

clean.dependsOn cleanupServerJars
