# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Settings specified in this file will override any Gradle settings
# configured through the IDE.

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=false

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# shiroikuma fork: keep the build log readable so real errors aren't buried.
# Suppress the javac "source/target 8 is obsolete" note and silence Gradle's
# own deprecation summary ("Deprecated Gradle features were used...").
android.javaCompile.suppressSourceTargetDeprecationWarning=true
org.gradle.warning.mode=none

# Customization versioning. customBuildNumber is bumped by tools/bump-build.sh on every dev build.
# customBaseVersionName/Code mirror upstream's defaultConfig values — bump manually when adopting a new upstream base.
customBuildNumber=90
customBaseVersionName=4.1.0
customBaseVersionCode=450
