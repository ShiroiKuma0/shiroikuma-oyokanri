import javax.inject.Inject

// SPDX-License-Identifier: GPL-3.0-or-later

plugins {
    id('com.android.library')
}

android {
    namespace 'io.github.muntashirakon.AppManager.docs'
    compileSdk compile_sdk
    buildToolsVersion = build_tools

    defaultConfig {
        minSdk min_sdk
        targetSdk target_sdk
    }

    compileOptions {
        encoding "UTF-8"
    }
}

// https://docs.gradle.org/current/userguide/service_injection.html#execoperations
interface InjectedExecOps {
    @Inject
    ExecOperations getExecOps()
}

tasks.register('buildDocs') {
    def injected = project.objects.newInstance(InjectedExecOps)
    // Capture project/rootProject references at configuration time (configuration-cache requirement
    // — Task.project access at execution time is forbidden).
    String capturedRootProjectDir = rootProject.projectDir.absolutePath
    File capturedRootDirFile = project.rootDir
    doLast {
        println("=== docs: start ===")
        String buildExec = "${capturedRootProjectDir}/scripts/make_docs.sh"
        injected.execOps.exec {
            workingDir = capturedRootDirFile
            executable = buildExec
        }
        println("=== docs: finish ===")
    }
}

tasks.register('cleanupDocs') {
    String capturedRootProjectDir = rootProject.projectDir.absolutePath
    doLast {
        File file = new File("${capturedRootProjectDir}/docs/src/main/res")
        if (file.exists()) {
            deleteDir(file)
        }
    }
}

def deleteDir(File dir) {
    if (dir != null && dir.isDirectory()) {
        String[] children = dir.list()
        if (children == null) return false
        for (String child : children) {
            boolean success = deleteDir(new File(dir, child))
            if (!success) return false
        }
        return dir.delete()
    } else if (dir != null && dir.isFile()) {
        return dir.delete()
    } else return false
}

preBuild.dependsOn buildDocs
clean.dependsOn cleanupDocs