        // Use the app's jdk15to18 provider family; mixing it with jdk18on duplicates signed classes.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcutil-jdk18on'
    }
}

android.applicationVariants.configureEach { variant ->
    String buildTypeCap = variant.buildType.name.capitalize()
    tasks.named("merge${buildTypeCap}Assets").configure { mergeTask ->
        mergeTask.dependsOn(":server:create${buildTypeCap}ServerJars")
    }
    tasks.matching {
        it.name == "generate${buildTypeCap}LintReportModel" || it.name == "lintAnalyze${buildTypeCap}"
    }.configureEach {
        dependsOn(":server:create${buildTypeCap}ServerJars")
    }
}

def buildTime() {
    // Configuration-cache-compatible external process: providers.exec is tracked as a CC fingerprint input,
    // unlike Groovy's String.execute() which is forbidden at configuration time.
    try {
        var execOutput = providers.exec {
            commandLine 'git', 'show', '--no-patch', '--format=%ct000'
            workingDir = rootProject.projectDir
        }
        var commitTime = execOutput.standardOutput.asText.get().trim()
        if (isDigitsOnly(commitTime)) {
            return Long.parseLong(commitTime)
        }
    } catch (Exception e) {
        // fall through to system time
    }
    println("Using system time as the build time.")
    return System.currentTimeMillis()
}

static def isDigitsOnly(CharSequence str) {
    final int len = str.length()
    for (int cp, i = 0; i < len; i += Character.charCount(cp)) {
        cp = Character.codePointAt(str, i)
        if (!Character.isDigit(cp)) {
            return false
        }
    }
    return true
}
