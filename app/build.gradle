plugins {
    id('com.android.application')
    id('dev.rikka.tools.refine') version "${refine_version}"
}

def customBuildNumber = (project.findProperty('customBuildNumber') ?: '0') as Integer
def customBaseVersionName = project.findProperty('customBaseVersionName') ?: '4.0.5'
def customBaseVersionCode = (project.findProperty('customBaseVersionCode') ?: '0') as Integer

android {
    namespace 'io.github.muntashirakon.AppManager'
    compileSdk compile_sdk
    buildToolsVersion = build_tools

    defaultConfig {
        applicationId 'shiroikuma.oyokanri'
        minSdk min_sdk
        targetSdk target_sdk
        versionCode customBaseVersionCode * 10000 + customBuildNumber
        versionName "${customBaseVersionName}+${customBuildNumber}"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        // Add build time to BuildConfig
        buildConfigField "long", "BUILD_TIME_MILLIS", "${buildTime()}"
    }

    signingConfigs {
        debug {
            storeFile file('dev_keystore.jks')
            storePassword 'kJCp!Bda#PBdN2RLK%yMK@hatq&69E'
            keyPassword 'kJCp!Bda#PBdN2RLK%yMK@hatq&69E'
            keyAlias 'key0'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "白い熊の応用管理"
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
            signingConfig signingConfigs.debug
            resValue "string", "app_name", "AM Debug"
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
        checkDependencies true
    }
    compileOptions {
        encoding "UTF-8"
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    splits {
        abi {
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
    aaptOptions {
        noCompress 'jar', 'sh'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/*.version']
            merges += ['baksmali.properties']
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
}

// Ensure :server:create<Variant>ServerJars writes am.jar + main.jar into
// app/src/main/assets/ BEFORE mergeAssets snapshots that directory. Upstream wires
// the JAR-creation task only as `javaCompileProvider.get().finalizedBy(jarTask)` in
// server/build.gradle, which is too loose under configuration-cache + parallel
// scheduling: mergeAssets can run before the finalizer completes, producing an APK
// that's missing am.jar / main.jar. The runtime symptom is
// ServerConfig.init() throwing `FileNotFoundException: am.jar`, leaving the
// "Mode of operation -> Custom command" UI with empty command boxes.
android.applicationVariants.configureEach { variant ->
    String variantName = variant.buildType.name.capitalize()
    variant.mergeAssetsProvider.configure {
        dependsOn ":server:create${variantName}ServerJars"
    }
}

