// Fork: run a git command and return its trimmed stdout, or "" if it fails for any reason.
// providers.exec is the configuration-cache-compatible way to start a process (same reason
// buildTime() below uses it); Groovy's String.execute() is forbidden at configuration time.
def gitOutput(List<String> command) {
    try {
        var execOutput = providers.exec {
            commandLine command
            workingDir = rootProject.projectDir
            ignoreExitValue = true
        }
        if (execOutput.result.get().exitValue != 0) {
            return ''
        }
        return execOutput.standardOutput.asText.get().trim()
    } catch (Exception e) {
        println("Git command [${command.join(' ')}] failed [$e]")
        return ''
    }
}

// Fork: the upstream commit our patches are rebased onto, rendered as ".<date>.g<sha8>".
// `custom` tracks upstream master commit by commit, so upstream's own versionName (4.1.0)
// stands still for months and says nothing about how current the fork is — this does.
//
//   merge-base HEAD master — NOT our own HEAD (which of *our* commits was built is already
//   said by +N and by the release tag) and NOT master's tip (which overstates the base
//   whenever master has been fast-forwarded but custom not yet rebased).
//
// The date is the base commit's committer date in UTC, never build time: every build on one
// upstream base must share the pin, and the date is there only so the names sort — a bare
// sha is random text and would bury the newest APK in the middle of a file listing.
// Degrades to ".g<sha>" if the date lookup fails and to "" if git or master is unavailable.
// The build must never fail over a missing pin.
def upstreamBasePin() {
    def sha = gitOutput(['git', 'merge-base', 'HEAD', 'master'])
    if (sha.length() < 8) {
        return ''
    }
    sha = sha.substring(0, 8)
    def epoch = gitOutput(['git', 'show', '-s', '--format=%ct', sha])
    if (!epoch.isEmpty() && isDigitsOnly(epoch)) {
        def date = java.time.Instant.ofEpochSecond(Long.parseLong(epoch))
                .atZone(java.time.ZoneOffset.UTC)
                .toLocalDate()
                .toString()
        return ".${date}.g${sha}"
    }
    return ".g${sha}"
}

def buildTime() {
    // Configuration-cache-compatible external process: providers.exec is tracked as a CC fingerprint input,
    // unlike Groovy's String.execute() which is forbidden at configuration time.
    try {
        var execOutput = providers.exec {
            commandLine 'git', 'show', '--no-patch', '--format=%ct000'
            workingDir = rootProject.projectDir
        }
        var commitTime = execOutput.standardOutput.asText.get().trim()
        if (isDigitsOnly(commitTime)) {
            return Long.parseLong(commitTime)
        }
    } catch (Exception e) {
        // fall through to system time
    }
    println("Using system time as the build time.")
    return System.currentTimeMillis()
}

static def isDigitsOnly(CharSequence str) {
    final int len = str.length()
    for (int cp, i = 0; i < len; i += Character.charCount(cp)) {
        cp = Character.codePointAt(str, i)
        if (!Character.isDigit(cp)) {
            return false
        }
    }
    return true
}
