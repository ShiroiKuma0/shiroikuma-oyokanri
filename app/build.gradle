plugins {
    id('com.android.application')
    id('dev.rikka.tools.refine') version "${refine_version}"
}

def customBuildNumber = (project.findProperty('customBuildNumber') ?: '0') as Integer
def customBaseVersionName = project.findProperty('customBaseVersionName') ?: '4.0.5'
def customBaseVersionCode = (project.findProperty('customBaseVersionCode') ?: '0') as Integer
// Fork: upstream-base pin (see upstreamBasePin() at the bottom of this file, the
// `git-versioning` skill, and the versioning section of CLAUDE.md). Script-level `def`,
// NOT inside android {} — nested-closure visibility there is unreliable and has silently
// produced an APK carrying the wrong version before.
def upstreamPin = upstreamBasePin()

android {
    namespace 'io.github.muntashirakon.AppManager'
    compileSdk compile_sdk
    buildToolsVersion = build_tools

    defaultConfig {
        applicationId 'shiroikuma.oyokanri'
        minSdk min_sdk
        targetSdk target_sdk
        versionCode customBaseVersionCode * 10000 + customBuildNumber
        // Fork: the build counter is zero-padded to three digits, matching the APK
        // filename convention (~/tmp then sorts in build order). It has to be done
        // HERE as well as in the delivery step, or the two disagree: the filename
        // read +062 while the manifest — which is what Android and every installer
        // actually show — read +62. versionCode above stays plain integer
        // arithmetic, so upgrade ordering is untouched; this is only how the name
        // reads.
        // Fork: ${upstreamPin} is ".<base commit date>.g<sha8>" — the upstream commit this
        // stack of patches sits on. Upstream's own versionName stands still between releases,
        // so without it nothing in the name says whether we are behind upstream.
        versionName "${customBaseVersionName}${upstreamPin}+${String.format('%03d', customBuildNumber)}"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        // Add build time to BuildConfig
        buildConfigField "long", "BUILD_TIME_MILLIS", "${buildTime()}"
    }

    signingConfigs {
        debug {
            storeFile file('dev_keystore.jks')
            storePassword 'kJCp!Bda#PBdN2RLK%yMK@hatq&69E'
            keyPassword 'kJCp!Bda#PBdN2RLK%yMK@hatq&69E'
            keyAlias 'key0'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "白い熊 応用管理"
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
            signingConfig signingConfigs.debug
            resValue "string", "app_name", "AM Debug"
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
        checkDependencies true
    }
    compileOptions {
        encoding "UTF-8"
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    splits {
        abi {
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
    aaptOptions {
        noCompress 'jar', 'sh'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/*.version']
            merges += ['baksmali.properties']
        }
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
}

// Fork: make the asset merge wait for :server:create<Variant>ServerJars, which
// writes am.jar + main.jar into app/src/main/assets/. Upstream only wires that
// task as `javaCompile.finalizedBy(jarTask)` (server/build.gradle) — too loose
// under configuration-cache + parallel scheduling, so mergeAssets can snapshot
// the directory mid-write. The earlier fix used the legacy applicationVariants
// API, which is unreliable under the configuration cache: in build +79 the edge
// silently did not hold and mergeAssets captured a 0-BYTE main.jar, which made
// AppManager's ADB server fail to launch (ADB mode hangs on init, then falls
// back to no-root). Wire the dependency directly on the merge tasks (plain task
// references, configuration-cache safe); the JARs are also written atomically
// server-side so a partial file can never be snapshotted even if this regresses.
['Debug', 'Release'].each { v ->
    tasks.matching { it.name == "merge${v}Assets" }.configureEach {
        dependsOn ":server:create${v}ServerJars"
    }
    // Upstream (4.1.1) additionally makes the lint model/analysis tasks wait for the
    // server JARs. Kept, but expressed through the same plain tasks.matching edge
    // rather than upstream's applicationVariants form, for the reason above.
    tasks.matching {
        it.name == "generate${v}LintReportModel" || it.name == "lintAnalyze${v}"
    }.configureEach {
        dependsOn ":server:create${v}ServerJars"
    }
}

